name: Verify and publish game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GAMEWEB_API_URL: ${{ vars.GAMEWEB_API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          ARENA_BROWSER: chromium
      - run: npm run test:accounts
        env:
          ARENA_BROWSER: chromium
      - run: python3 build-standalone.py
      - run: python3 build-site.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: gameweb-ci-${{ github.run_id }}
      POSTGRES_ADMIN_PASSWORD: ci-only-administrator-password
      POSTGRES_PASSWORD: ci-only-application-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: docker compose -f backend/compose.yml up --build --wait --wait-timeout 150 -d db api
      - run: node backend/test/container-smoke.js
      - if: failure()
        run: docker compose -f backend/compose.yml logs --tail 100 api db
      - if: always()
        run: docker compose -f backend/compose.yml down --volumes

  deploy:
    if: github.event_name != 'pull_request'
    needs: [verify, container]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
